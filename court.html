<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<!-- iPhone Safari 冇 element fullscreen API,唯一全螢幕方法係「分享 → 加到主畫面」,
     加咗呢兩個 meta 之後由主畫面圖示開就會冇瀏覽器工具列。-->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>旅遊法庭 · 原型</title>
<style>
:root{ --ink:#EFF4FF; color-scheme:light; }
*{box-sizing:border-box;}
body{margin:0;background:#101820;min-height:100dvh;
  font:16px/1.6 -apple-system,"PingFang HK","Noto Sans HK",sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;}
/* ⚠ 唔可以淨係寫 width:100% ＋ aspect-ratio —— 高度就由闊度推出嚟,
   手機打橫（例如 844×390）會變成 844×475,爆出螢幕底,對話框同控制列見唔到。
   所以闊度要**同時**受螢幕高度夾住：高度可用幾多,就反推最多可以幾闊。
   3.4rem 係留返俾下面條 .tip 提示（打橫太矮就會隱藏,見文件最底 media query）。*/
.stage{position:relative;width:min(100%, 900px, calc((100dvh - 3.4rem) * 16 / 9));
  aspect-ratio:16/9;overflow:hidden;
  /* 入面所有尺寸用 cqw 跟住畫面縮放。設計闊度 900px → calc(1 * var(--u)) = 9px。
     ⚠ 用 rem 嘅話畫面縮細咗字唔會縮,手機打橫一定爆框。*/
  container-type:inline-size;
  /* 基準單位。設計闊度 900px 時 1cqw = 9px,所有尺寸都用 calc(N * var(--u)) 寫。
     ⚠ 唔可以淨係 1cqw —— 打直時畫面得 375px 闊,字會縮到 6px,睇唔到。
       所以夾個下限 6.6px（＝設計尺寸嘅 73%）,打直時仍然讀得到。*/
  --u:max(6.6px, 1cqw);
  background:#2A2118 url(art/briefing/bg.webp) center/cover no-repeat;}
/* 背景要退後,角色先突出 */
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 46%, rgba(20,12,4,.42) 100%);}

/* 角色立繪：貼住底邊。
   ⚠ 長文字階段（指證／結算）一定要加 .up —— 三個選項一出,個框就長到冚住成塊面。
     縮細移上之後,個頭永遠喺框上面,睇得到表情先有戲。*/
.who{position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  height:96%;z-index:2;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45));
  animation:pop .22s ease-out;transition:height .3s ease, top .3s ease;}
.who.up{height:31%;bottom:auto;top:2%;}
@keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(10px) scale(.985);}
               to{opacity:1;transform:translateX(-50%);}}
.who.shake{animation:shake .38s;}
@keyframes shake{0%,100%{transform:translateX(-50%);}
  20%{transform:translateX(-50%) translate(-7px,2px);}
  45%{transform:translateX(-50%) translate(6px,-2px);}
  70%{transform:translateX(-50%) translate(-4px,1px);}}

/* 對話框 */
.box{position:absolute;left:2.2%;right:2.2%;bottom:11%;z-index:5;
  /* ⚠ 唔可以喺呢度加 overflow:auto —— 名牌 .plate 係 top:-13px 凸出框外,
     一開 overflow 就會被剪走（實測名牌變咗暗一橛）。長文字靠 .tall 撐開就夠。*/
  background:linear-gradient(180deg,rgba(20,34,58,.96),rgba(8,16,29,.97));
  border:2px solid #050B15;border-radius:10px;padding:calc(1.78 * var(--u)) calc(1.69 * var(--u)) calc(1.51 * var(--u));
  box-shadow:0 5px 0 rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.14);
  color:var(--ink);min-height:calc(11.7 * var(--u));cursor:pointer;}
.plate{position:absolute;top:calc(-1.44 * var(--u));left:calc(1.78 * var(--u));
  background:linear-gradient(180deg,#5AB0DC,#2A6FA8);border:2px solid #050B15;
  border-radius:5px;padding:calc(.11 * var(--u)) calc(1.56 * var(--u));font-size:calc(1.46 * var(--u));font-weight:800;letter-spacing:.05em;
  box-shadow:0 2px 0 rgba(0,0,0,.3);}
.line{margin:0;font-size:calc(1.81 * var(--u));min-height:3.2em;white-space:pre-wrap;}
/* 角色維持原大小,所以個框要由頭部下面開始（實測頭部去到約 38%）。
   ⚠ 選項改成「三個都係一行」之後個框短咗好多,可以由 39% 放返落 46%,露多啲塊面。
     再低就唔夠位擺三個選項。*/
.box.tall{top:46%;bottom:10.5%;max-height:none;}
/* 指證階段選項多,字要細啲先入得晒 */
.box.tall .opt{font-size:calc(1.53 * var(--u));padding:calc(.8 * var(--u)) calc(1.07 * var(--u));}
.box.tall .line{font-size:calc(1.71 * var(--u));min-height:0;}
.next{position:absolute;right:calc(1.56 * var(--u));bottom:calc(1 * var(--u));color:#FFD84A;font-weight:800;font-size:calc(1.6 * var(--u));
  animation:blink 1s steps(2) infinite;}
@keyframes blink{50%{opacity:.25;}}

/* 指證：四個頭像排開 */
.pick{position:absolute;inset:0;z-index:6;background:rgba(8,14,24,.82);
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:calc(1.24 * var(--u));}
.pick.on{display:flex;}
.pick h2{color:#FFD84A;margin:0;font-size:calc(1.87 * var(--u));letter-spacing:.06em;}
.row{display:flex;gap:1.4%;justify-content:center;width:96%;}
.card{flex:1;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.24);
  border-radius:10px;padding:calc(.71 * var(--u)) calc(.36 * var(--u)) calc(.89 * var(--u));cursor:pointer;text-align:center;color:var(--ink);
  transition:transform .12s, border-color .12s, background .12s;}
.card:hover{transform:translateY(-5px);border-color:#FFD84A;background:rgba(255,216,74,.14);}
.card img{width:100%;display:block;}
.card b{font-size:calc(1.46 * var(--u));}

/* 三選一 */
.opts{margin-top:calc(.98 * var(--u));display:grid;gap:calc(.67 * var(--u));}
.opt{text-align:left;padding:calc(.98 * var(--u)) calc(1.16 * var(--u));border-radius:8px;cursor:pointer;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.22);
  color:#E9F0FB;font:inherit;font-size:calc(1.6 * var(--u));}
.opt:hover{background:rgba(255,255,255,.16);border-color:#7FC4F0;}
.opt b{color:#FFD84A;margin-right:calc(.71 * var(--u));}
.opt.ok{background:rgba(70,200,140,.24);border-color:#5ADCA0;}
.opt.no{background:rgba(235,95,140,.24);border-color:#FF82AA;}

/* ── 回合封面：淨係背景圖 ＋「第X回合」,1.5 秒後自動入開場,撳一下／撳掣可以即刻跳 ── */
.cover{position:absolute;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;
  cursor:pointer;opacity:1;transition:opacity .38s ease;
  /* ⚠ 暗罩要比 .intro 淺好多(呢度先係想睇背景),但唔可以完全冇 ——
     abstract 個幾何空間同 fruit 個果園係淺色底,白字會消失。*/
  background:radial-gradient(ellipse at 50% 50%, rgba(6,11,20,.30), rgba(4,8,15,.64));}
.cover .rn{position:relative;color:#F4F8FF;font-weight:800;font-size:calc(4.8 * var(--u));letter-spacing:.34em;
  text-indent:.34em;   /* ⚠ letter-spacing 會喺最後一個字後面都加空隙,唔補返 text-indent 就會偏左 */
  text-shadow:0 2px 0 rgba(0,0,0,.55), 0 0 30px rgba(0,0,0,.6);}
/* 只喺字後面落一層柔暈,唔壓暗成幅背景 —— abstract 同 fruit 係淺色底,淨靠 text-shadow 唔夠爽利 */
.cover .rn::before{content:"";position:absolute;z-index:-1;left:-16%;right:-16%;top:-46%;bottom:-46%;
  background:radial-gradient(ellipse at 50% 50%, rgba(4,8,15,.66), rgba(4,8,15,0) 70%);}
.cover.out{opacity:0;pointer-events:none;}

/* ── 開場：講明呢個回合考咩 ── */
.intro{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:calc(.89 * var(--u));text-align:center;color:#EFF4FF;
  background:radial-gradient(ellipse at 50% 45%, rgba(10,18,32,.72), rgba(6,11,20,.93));}
.intro .rd{color:#8C9BB2;font-size:calc(1.51 * var(--u));letter-spacing:.22em;}
.intro h1{margin:calc(.18 * var(--u)) 0 calc(.36 * var(--u));font-size:calc(3.56 * var(--u));letter-spacing:.04em;
  text-shadow:0 3px 0 rgba(0,0,0,.45);}
.intro .sub{color:#BCC9DC;font-size:calc(1.64 * var(--u));max-width:78%;line-height:1.7;}
.intro .src{color:#7F8DA3;font-size:calc(1.39 * var(--u));margin-top:calc(.36 * var(--u));}
.intro button{margin-top:calc(1.78 * var(--u));padding:calc(1.07 * var(--u)) calc(3.73 * var(--u));border:2px solid #050B15;border-radius:8px;
  background:linear-gradient(180deg,#5AB0DC,#2A6FA8);color:#fff;font:inherit;font-weight:800;font-size:calc(1.78 * var(--u));
  letter-spacing:.1em;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.35);}
.intro button:hover{filter:brightness(1.1);}

/* 成績記錄提示 ＋ 返回主 app */
.gnote{position:absolute;left:50%;top:calc(.89 * var(--u));transform:translateX(-50%);z-index:12;
  padding:calc(.6 * var(--u)) calc(1.42 * var(--u));border-radius:999px;background:rgba(8,14,26,.86);color:#DCE7F5;
  font-size:calc(1.35 * var(--u));opacity:0;transition:opacity .3s;pointer-events:none;}
.gnote.on{opacity:1;}
.gback{position:absolute;left:calc(.89 * var(--u));top:calc(.89 * var(--u));z-index:12;width:calc(3.33 * var(--u));height:calc(3.33 * var(--u));border-radius:8px;
  display:flex;align-items:center;justify-content:center;text-decoration:none;
  background:rgba(8,14,26,.5);color:#CFE0F5;font-size:calc(1.78 * var(--u));}
.gback:hover{background:rgba(8,14,26,.75);}

/* ── 底部控制列 ── */
.bar{position:absolute;left:2.2%;right:2.2%;bottom:.5%;z-index:6;
  display:flex;align-items:center;gap:calc(.89 * var(--u));}
.bar button{border:2px solid #050B15;border-radius:7px;padding:calc(.57 * var(--u)) calc(1.42 * var(--u));
  font:inherit;font-size:calc(1.49 * var(--u));font-weight:700;cursor:pointer;
  background:rgba(30,48,80,.92);color:#DCE6F5;box-shadow:0 2px 0 rgba(0,0,0,.3);}
.bar button:disabled{opacity:.38;cursor:default;}
.bar button:not(:disabled):hover{background:rgba(52,80,124,.95);}
.bar .pos{color:#9FB4D4;font-size:calc(1.42 * var(--u));font-variant-numeric:tabular-nums;min-width:calc(7.5 * var(--u));
  text-align:center;}
.bar .sp{flex:1;}
.bar .obj{background:linear-gradient(180deg,#E8434A,#B21F26);color:#fff;
  border-color:#3A0A0C;letter-spacing:.14em;padding:calc(.6 * var(--u)) calc(1.96 * var(--u));}
.bar .obj:hover{filter:brightness(1.12);}
/* 全螢幕掣。⚠ 唔係所有瀏覽器都支援（iPhone Safari 一直冇 element fullscreen）,
   所以預設 hidden,偵測到支援先顯示 —— 擺個撳極都冇反應嘅掣出嚟更差。*/
.bar .fs{padding:calc(.57 * var(--u)) calc(.9 * var(--u));
  font-size:calc(1.7 * var(--u));line-height:1;
  /* ⚠ 呢個掣主要喺手機撳,唔可以淨係跟畫面縮放 —— 實測手機打橫得 26×24px,手指撳唔中。
     落個絕對下限,桌面版本身已經夠大所以睇唔出分別。*/
  min-width:38px;min-height:32px;}

/* ── 反對！衝擊圖 ── */
.boom{position:absolute;inset:0;z-index:9;display:none;place-items:center;
  background:rgba(0,0,0,.28);}
.boom.on{display:grid;animation:flash .5s;}
@keyframes flash{0%{background:rgba(255,255,255,.9);}18%{background:rgba(0,0,0,.28);}}
.boom svg{width:84%;max-width:620px;animation:slam .42s cubic-bezier(.16,1.5,.4,1);}
@keyframes slam{0%{transform:scale(.2) rotate(-14deg);opacity:0;}
                55%{transform:scale(1.12) rotate(3deg);opacity:1;}
                100%{transform:scale(1) rotate(0);}}
@media (prefers-reduced-motion:reduce){.boom.on,.boom svg{animation:none;}}

.hp{position:absolute;top:calc(1.11 * var(--u));right:calc(1.56 * var(--u));z-index:6;display:flex;gap:calc(.56 * var(--u));}
.hp i{width:calc(1.67 * var(--u));height:calc(1.67 * var(--u));border-radius:50%;background:#FFD84A;
  border:2px solid #050B15;box-shadow:0 2px 0 rgba(0,0,0,.3);}
.hp i.off{background:#4A5566;}
.tip{color:#8C9BB2;font-size:.8rem;margin:.6rem 0 1.2rem;text-align:center;padding:0 .8rem;}
/* 手機打橫,高度好矜貴：收起提示條,畫面食盡成個高度。
   操作提示喺畫面底部條控制列本身已經睇到（◀ 上一句 / 下一句 ▶ / 反對！）。*/
@media (orientation:landscape) and (max-height:560px){
  .tip{display:none;}
  .stage{width:min(100%, 900px, calc(100dvh * 16 / 9));}
}
/* 打直：畫面被闊度鎖死（375px 闊 → 只有 211px 高）,三選一嗰陣個框點都放唔落。
   ⚠ 呢個唔係新問題 —— 改成 cqw 之前已經爆 95px,而家先爆 57px。
   打直冇得再撐闊,唯有把個框由 46% 提到 20%,用「遮多啲塊面」換返「文字入得曬」。
   打橫唔受影響（呢個 media query 只喺打直生效）。*/
@media (orientation:portrait){
  .box.tall{top:20%;bottom:7%;}
  .box.tall .opt{padding:calc(.6 * var(--u)) calc(1.07 * var(--u));}
}
</style>

<div class="stage" id="stage">
  <div class="hp" id="hp"></div>
  <img class="who" id="who" alt="">
  <div class="box" id="box">
    <span class="plate" id="plate">　</span>
    <p class="line" id="line"></p>
    <span class="next" id="next">▼</span>
  </div>
  <div class="bar" id="bar">

    <h1 id="topic">經濟「流失」</h1>

      其中一位說錯了——讀到不對勁的一句，就按下「反對！」。</p>

    <button id="go">開　始</button>
  </div>
</div>
<p class="tip">◀ ▶ 前後翻睇　·　覺得邊句唔對路就撳「反對！」　·　鍵盤：← → 翻頁、Enter 反對</p>

function shuffled(n){
  var a=[],i,j,t; for(i=0;i<n;i++) a.push(i);
  for(i=n-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=a[i];a[i]=a[j];a[j]=t; }
  return a;
}

  for(var i=0;i<ORDER.length;i++){

    R.w=ws[i%ws.length];
    R.p=shuffled(4);
    /* ⚠ 三個選項一定要洗牌。寫稿嗰陣順手把正解擺同一個位,實測 311 套之中
       第一冊全部喺 B、第二至四冊加寫全部喺 A —— 玩幾個回合就會發現規律,
       玩家唔使睇內容都撳得中。喺呢度洗,無論份稿點寫都唔會漏。*/
    var op=shuffled(3), no=[];
    for(var k=0;k<3;k++) no.push(R.opts[op[k]]);

}

/* ── 「反對！」衝擊圖（純 SVG） ──
   ⚠ X 同 Y 半徑要分開。共用一個 R 嘅話上下尖角會畫出 viewBox 之外被裁走。*/
function burstPath(cx,cy,Rx,Ry,rx,ry,n,seed){
  var p=[],a,f,ex,ey;
  for(var k=0;k<n*2;k++){
    a=Math.PI*2*k/(n*2)-Math.PI/2;
    f=0.86+0.28*((Math.sin(seed+k*2.7)+1)/2);
    ex=(k%2?rx:Rx)*f; ey=(k%2?ry:Ry)*f;
    p.push((k?"L":"M")+(cx+Math.cos(a)*ex).toFixed(1)+" "+(cy+Math.sin(a)*ey).toFixed(1));
  }
  return p.join("")+"Z";
}

  clearOpts();
  el("plate").textContent="指證成立";
  el("line").innerHTML="<b style='color:#5ADCA0'>指證成立。</b>（正確答案："+"ABC"[n]+"）<br>"+
    ROUND.note.replace(/\n/g,"<br>")+
    "<br><span style='color:#8C9BB2;font-size:calc(1.53 * var(--u))'>"+ROUND.src+"</span>";
  el("next").style.display="";
}

/* ── YHP ── */
function yhpSay(lines,expr,after){
  yq=lines.slice(); yi=0; phase="yhp";
  el("bar").style.display="none";
  clearOpts();
  setWho(art("yhp",expr));
  el("plate").textContent=CAST.yhp.n;
  type(yq[0]);
  window.__after=after;
}
function yhpStep(){
  if(phase!=="yhp") return;
  if(typing){ clearInterval(typing); typing=null;
    el("line").textContent=yq[yi]; el("next").style.display=""; return; }
  yi++;
  if(yi<yq.length){ type(yq[yi]); return; }
  var f=window.__after; window.__after=null;
  if(f) f();
}

/* ── 回合流程 ── */
var coverT=null;
function showCover(txt,then){
  phase="cover";
  /* ⚠ 封面個暗罩淺(想睇到背景),所以對白框同角色圖會透晒出嚟,仲會遮住「第X回合」。
     .intro 嗰個罩夠深先睇唔到。封面期間要真係收起佢哋。*/
  el("box").style.display="none";
  el("who").style.visibility="hidden";
  el("coverRd").textContent=txt;
  var c=el("cover");
  c.classList.remove("out"); c.style.display="";
  clearTimeout(coverT);
  coverT=setTimeout(function(){ hideCover(then); },1500);
}
function hideCover(then){
  if(phase!=="cover") return;            /* ⚠ 撳同計時器會撞,要擋住行兩次 */
  clearTimeout(coverT);
  var c=el("cover");
  c.classList.add("out");
  setTimeout(function(){
    c.style.display="none";
    el("box").style.display=""; el("who").style.visibility="";
    if(then) then();
  },380);
}
function showIntro(){
  phase="intro";
  setScene();                          /* ⚠ 要喺 intro 就換,唔係開場先換,
                                          否則封面會用返上一個回合嘅背景。*/
  /* ⚠ 回合號要跟「今局第幾個」計,唔可以寫死喺資料入面 —— 主題洗過牌。*/
  el("intro").querySelector(".rd").textContent="第 "+CN.charAt(ri)+" 回 合";
  el("topic").textContent=ROUND.topic;
  el("brief").innerHTML=ROUND.brief;
  el("src").innerHTML=ROUND.src;      /* ⚠ 要點入面有 <b>,用 textContent 會照原樣印出標籤 */
  el("bar").style.display="none";
  /* 封面行先,淡出之後先見到呢版資訊 */
  el("intro").style.display="none";
  showCover(el("intro").querySelector(".rd").textContent, function(){
    phase="intro"; el("intro").style.display="";
  });
}
function startRound(){
  el("intro").style.display="none";
  i=0; life=3; hearts();
  yhpSay(YHP.open.map(function(t){ return t.replace("__TOPIC__",ROUND.topic); }),0,
    function(){ phase="say"; el("bar").style.display=""; render(); });
}
function nextRound(){
  ri++;
  if(ri>=ORDER.length){
    saveResult(ORDER.length);                 /* 全部回合完成 */
    yhpSay(YHP.fin,2,function(){ phase="over"; el("next").style.display="none"; });
    return;
  }
  ROUND=ROUNDS[ORDER[ri]];
  showIntro();
}

/* ── 全螢幕 ── */
var fsEl=document.documentElement;
function fsOn(){ return !!(document.fullscreenElement||document.webkitFullscreenElement); }
function fsCan(){ return !!(fsEl.requestFullscreen||fsEl.webkitRequestFullscreen); }
function fsPaint(){
  var b=el("fs"); if(!b) return;
  b.textContent = fsOn() ? "⛝" : "⛶";
  b.title = b.ariaLabel = fsOn() ? "離開全螢幕" : "全螢幕";
}
if(fsCan()){
  el("fs").hidden=false;
  el("fs").addEventListener("click",function(ev){
    ev.stopPropagation();
    /* ⚠ requestFullscreen() 回傳 promise,失敗係 **reject** 唔係 throw ——
       只寫 try/catch 接唔到,用戶就會見到「撳極都冇反應」,連個原因都唔知。
       實測 iframe／權限受限嘅環境會 reject 一個 "Permissions check failed"。*/
    var p;
    try{
      p = fsOn() ? (document.exitFullscreen||document.webkitExitFullscreen).call(document)
                 : (fsEl.requestFullscreen||fsEl.webkitRequestFullscreen).call(fsEl);
    }catch(e){ note("呢個瀏覽器唔支援全螢幕"); return; }
    if(p && p.catch) p.catch(function(){ note("呢個瀏覽器唔准全螢幕"); });
  });
  ["fullscreenchange","webkitfullscreenchange"].forEach(function(t){
    document.addEventListener(t,fsPaint);
  });
  fsPaint();
}

el("cover").addEventListener("click",function(){
  hideCover(function(){ phase="intro"; el("intro").style.display=""; });
});
el("go").addEventListener("click",startRound);
el("box").addEventListener("click",function(){
  if(phase==="yhp") yhpStep();
  else if(phase==="result"){ yhpSay(YHP.done,2,nextRound); }   // 一撳就過,唔使按鈕
  else tap();
});
el("prev").addEventListener("click",function(){ step(-1); });
el("nextb").addEventListener("click",function(){ step(1); });
el("obj").addEventListener("click",objection);
document.addEventListener("keydown",function(e){
  if(phase==="cover"){                   /* 封面期間任何掣都係「跳過」,唔可以跌落去翻頁／反對 */
    hideCover(function(){ phase="intro"; el("intro").style.display=""; });
    e.preventDefault(); return;
  }
  if(phase==="intro") return;            /* ⚠ 開場期間本來冇擋,撳 Enter 會偷偷叫 objection() */
  if(phase==="yhp"){ if(e.key===" "||e.key==="Enter") yhpStep(); return; }
  if(phase==="result"){ if(e.key===" "||e.key==="Enter") yhpSay(YHP.done,2,nextRound); return; }
  if(e.key==="ArrowLeft") step(-1);
  else if(e.key==="ArrowRight") step(1);
  else if(e.key===" ") tap();
  else if(e.key==="Enter") objection();
});
/* ⚠ 封面一開就要見到新背景。第一次去某個世界時張圖未解碼,會閃一下上一個回合嘅背景 ——
   喺封面度最刺眼。11 張 bg 加埋約 1.3MB,開場預載晒就唔會閃。*/
WORLDS.forEach(function(w){ var im=new Image(); im.src="art/"+w.dir+"/bg.webp"; });

deal(); ri=0; ROUND=ROUNDS[ORDER[0]];
hearts(); showIntro();
})();
</script>
